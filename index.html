<script>var DATA = null;

  return localStorage.getItem("dcinfo_code") || "";

  return "";

}

function srv(fn, args, ok, fail) {

  var m = String(e && e.message || e);

function contactShift(P) {

function orderSearch(q, outId) {

function nsuggest(q) {
 q = norm(q).trim();
 if (!q) return [];
 var out = [], cities = {}, hubs = [];
 var sc = function(s) {
  var site = norm(s.site), nm = norm(nstoreName(s)), ct = norm(s.city);
  return site.indexOf(q) === 0 ? 0 : nm.indexOf(q) === 0 ? 1 : ct.indexOf(q) === 0 ? 2 : nm.indexOf(q) >= 0 || site.indexOf(q) >= 0 ? 3 : ct.indexOf(q) >= 0 ? 4 : norm(s.store).indexOf(q) >= 0 ? 5 : 9;
 };
 var st = NET.stores.filter(function(s) {
  return NAREA === "ALL" || s.area === NAREA;
 }).map(function(s) {
  return {
   s: s,
   k: sc(s)
  };
 }).filter(function(x) {
  return x.k < 9;
 }).sort(function(a, b) {
  return a.k - b.k || String(a.s.site).localeCompare(b.s.site);
 });
 NET.stores.forEach(function(s) {
  var c = String(s.city || "").toUpperCase();
  if (c && norm(c).indexOf(q) >= 0) (cities[c] = cities[c] || []).push(s);
 });
 NET.points.forEach(function(P) {
  if (P.type === "CITY" || !(P.stores.length || P.hubs.length)) return;
  if (norm(P.name).indexOf(q) >= 0 || P.hubs.some(function(h) {
   return norm(h.name).indexOf(q) >= 0 || norm(h.site) === q;
  })) hubs.push(P);
 });
 Object.keys(cities).sort(function(a, b) {
  return (norm(a).indexOf(q) === 0 ? 0 : 1) - (norm(b).indexOf(q) === 0 ? 0 : 1) || cities[b].length - cities[a].length;
 }).slice(0, 2).forEach(function(c) {
  if (cities[c].length > 1) out.push({
   kind: "city",
   city: c,
   n: cities[c].length
  });
 });
 hubs.slice(0, 2).forEach(function(P) {
  out.push({
   kind: "hub",
   P: P
  });
 });
 st.slice(0, 8 - out.length).forEach(function(x) {
  out.push({
   kind: "store",
   s: x.s
  });
 });
 return out;
}
